<header></header>
<main></main>
<footer></footer>

<form>
    <!-- Row 1: First & Last Name -->
    <div class="form-row">
        <label for="first-name">First Name</label>
        <input type="text" id="first-name" name="first-name" required>

        <label for="last-name">Last Name</label>
        <input type="text" id="last-name" name="last-name" required>
    </div>

    <!-- Row 2: Email -->
    <div class="form-row">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
    </div>

    <!-- Row 3: Number of Tickets -->
    <div class="form-row">
        <label for="tickets">Number of Tickets</label>
        <input type="number" id="tickets" name="tickets" min="1" max="10" required>
    </div>

    <!-- Row 4: Lunch Preference (Radio Buttons) -->
    <fieldset>
        <legend>Lunch Preference</legend>
        <label><input type="radio" name="lunch" value="Vegetarian"> Vegetarian</label>
        <label><input type="radio" name="lunch" value="Vegan"> Vegan</label>
        <label><input type="radio" name="lunch" value="None"> No Preference</label>
    </fieldset>

    <!-- Row 5: Workshop Sessions (Checkboxes) -->
    <fieldset>
        <legend>Workshop Sessions</legend>
        <label><input type="checkbox" name="workshop" value="Morning"> Morning Session</label>
        <label><input type="checkbox" name="workshop" value="Afternoon"> Afternoon Session</label>
        <label><input type="checkbox" name="workshop" value="Evening"> Evening Session</label>
    </fieldset>

    <!-- Row 6: Special Requests -->
    <div class="form-row">
        <label for="notes">Special Requests / Notes</label>
        <textarea id="notes" name="notes" rows="4" placeholder="Let us know any preferences..."></textarea>
    </div>

    <!-- Submit Button -->
    <div class="form-row">
        <button type="submit">Register</button>
    </div>
</form>
